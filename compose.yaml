name: amanet-local

services:
  postgres:
    image: postgres:18.7-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amanet_dev}
      POSTGRES_USER: ${POSTGRES_USER:-amanet_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amanet_local_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  postgres-test:
    image: postgres:18.7-alpine3.24
    profiles: ["test"]
    environment:
      POSTGRES_DB: amanet_test
      POSTGRES_USER: amanet_test
      POSTGRES_PASSWORD: amanet_local_test_only
    ports:
      - "127.0.0.1:54330:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amanet_test -d amanet_test"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
